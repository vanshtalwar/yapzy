# coturn — PRODUCTION template (bare-metal or VM TURN fleet; see docs/PRODUCTION_CHECKLIST.md).
# Fill in the <placeholders>; pass secrets on the command line or via a secrets manager, never
# in this file:
#   turnserver -c turnserver.production.conf \
#     --static-auth-secret="$TURN_SECRET" --external-ip=<public-ip>[/<private-ip>]
# CI checks that the SSRF protections below stay in this file.

# --- Listeners ----------------------------------------------------------------------------
# Plain TURN/STUN on 3478 plus TURN over TLS on 443 for restrictive networks (turns:...:443).
listening-port=3478
tls-listening-port=443
# alt-tls-listening-port=5349
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
cipher-list=ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
no-tlsv1
no-tlsv1_1
min-port=49160
max-port=65535

# --- Auth: ephemeral HMAC credentials minted by the API (GET /v1/turn-credentials) ----------
use-auth-secret
realm=<turn.example.com>
fingerprint
stale-nonce=600
no-software-attribute
no-cli

# --- SSRF protection: relay only to public internet peers -----------------------------------
no-tcp-relay
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Add the TURN host's own public/private addresses and any internal VPC ranges, e.g.:
# denied-peer-ip=<vpc-cidr-start>-<vpc-cidr-end>

# --- Abuse limits ---------------------------------------------------------------------------
# One video call uses 2–4 allocations per user; bandwidth cap per session ≈ 3 Mbit/s.
user-quota=12
total-quota=<allocations per node, e.g. 20000>
max-bps=3000000
# bps-capacity=<node uplink in bits/s>

# --- Logging (no IPs in application logs; coturn logs go to the host's protected syslog) ---
syslog
simple-log
