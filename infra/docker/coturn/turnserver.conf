# coturn — development configuration.
# Secrets are NOT stored here: `static-auth-secret` (TURN_SECRET) and `external-ip`
# (TURN_EXTERNAL_IP) are passed as command-line flags from docker-compose.yml.

listening-port=3478
# Relay port range; must match the published UDP range in docker-compose.yml.
min-port=49160
max-port=49200

# Ephemeral credentials: username = "<expiry-unix-ts>:<id>", password = base64(HMAC-SHA1(secret, username)).
# The API (Part 3) mints them; coturn verifies with the shared TURN_SECRET.
use-auth-secret
realm=randomchat.local

fingerprint
no-cli
no-multicast-peers
no-tls
no-dtls
no-software-attribute
log-file=stdout
simple-log

# --- Relay restrictions (also in development) ----------------------------------------
# A TURN server relays to any "peer" a client names, so it must not reach internal
# services (SSRF). Browsers only use UDP relays: TCP relay allocations (RFC 6062) are off,
# which also keeps TCP-only services (Redis, Postgres) out of reach.
no-tcp-relay
# Never legitimate peers in development: Docker networks (redis/postgres/minio containers
# live in 172.16.0.0/12), link-local/cloud metadata, other private and reserved ranges.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=200

# --- Local development (Docker Desktop on macOS) ------------------------------------
# Browsers on the host reach coturn through published ports on 127.0.0.1, so relay
# candidates advertise TURN_EXTERNAL_IP (default 127.0.0.1). When both peers are relayed
# (NEXT_PUBLIC_FORCE_TURN_RELAY=true) the peer address of each allocation is the other
# allocation's 127.0.0.1:<port>, i.e. a loopback peer. Inside the container loopback is
# coturn itself, so allowing it exposes nothing else. LAN testing (TURN_EXTERNAL_IP =
# 192.168.x.y) needs 192.168.0.0/16, so that range stays allowed in development.
allow-loopback-peers

# PRODUCTION uses infra/coturn/turnserver.production.conf (TLS on 443, every private and
# loopback range denied, quotas); never this file.
