# Local development infrastructure. Run from the repo root via `pnpm infra:up`
# (which passes `--env-file .env` so ${VARS} below come from the root .env).
name: randomchat

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Dev-only credentials; must match DATABASE_URL / DATABASE_URL_TEST in .env.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port is configurable because a native Postgres often already owns 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/ (mount the parent).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app && pg_isready -U app -d app_test']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    # AOF off in dev: faster, and nothing in Redis must survive a reset.
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.18-alpine
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in .env}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      # Not bound to 127.0.0.1 so phones/laptops on the LAN can be tested (see CONTEXT.md).
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Community fork of MinIO (upstream stopped publishing images in 2025); same S3 API,
    # same console. Pinned to a release tag for reproducibility.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-evidence}
      S3_BUCKET_FRAMES: ${S3_BUCKET_FRAMES:-frames}
    entrypoint: ['/bin/sh', '/init.sh']
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/frames-lifecycle.json:/frames-lifecycle.json:ro
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
