# Local development infrastructure. Run from the repo root via `pnpm infra:up`
# (which passes `--env-file .env` so ${VARS} below come from the root .env).
# Profiles: `observability` (Prometheus + Grafana, `pnpm obs:up`) and `full` (every app in a
# container as well, `pnpm stack:up`; stop the dev servers first, the ports are the same).
name: randomchat

# Containers of the `full` profile: the root .env plus in-network addresses. Browser-facing
# URLs (NEXT_PUBLIC_*, TURN_HOST, S3_PUBLIC_ENDPOINT) stay on localhost.
x-app: &app
  profiles: [full]
  env_file: ../../.env
  restart: unless-stopped
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Dev-only credentials; must match DATABASE_URL / DATABASE_URL_TEST in .env.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port is configurable because a native Postgres often already owns 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/ (mount the parent).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app && pg_isready -U app -d app_test']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    # AOF off in dev: faster, and nothing in Redis must survive a reset.
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.18-alpine
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in .env}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      # Relayed↔relayed calls make coturn its own peer: it maps the external IP back to its
      # container address, which the 172.16.0.0/12 rule in turnserver.conf would deny. Exempt
      # exactly that address (the image entrypoint evaluates $(...) in arguments).
      - --allowed-peer-ip=$$(hostname -i)
    ports:
      # This machine only by default; TURN_BIND_IP=0.0.0.0 exposes it to phones/laptops on the
      # LAN (docs/LAN_TESTING.md).
      - '${TURN_BIND_IP:-127.0.0.1}:3478:3478/udp'
      - '${TURN_BIND_IP:-127.0.0.1}:3478:3478/tcp'
      - '${TURN_BIND_IP:-127.0.0.1}:49160-49200:49160-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # Community fork of MinIO (upstream stopped publishing images in 2025); same S3 API,
    # same console. Pinned to a release tag for reproducibility.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-evidence}
      S3_BUCKET_FRAMES: ${S3_BUCKET_FRAMES:-frames}
    entrypoint: ['/bin/sh', '/init.sh']
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/frames-lifecycle.json:/frames-lifecycle.json:ro
    restart: 'no'

  # --- Profile `observability` (`pnpm obs:up`): Prometheus scrapes the services on the host
  # (and the `full` profile's containers); Grafana on http://localhost:3002 with the provisioned
  # "RandomChat — overview" dashboard (anonymous read-only access; admin login for edits).
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      # Linux engines need this mapping; Docker Desktop provides it already.
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/randomchat.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # --- Profile `full`: the apps, built from their Dockerfiles (context = repo root).
  migrate:
    profiles: [full]
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *app
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:4000:4000'
    depends_on: &app-deps
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  gateway:
    <<: *app
    build: { context: ../.., dockerfile: apps/gateway/Dockerfile }
    environment:
      <<: *app-env
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_NODE_ID: gw-container
    ports:
      - '127.0.0.1:4001:4001'
    depends_on: *app-deps

  worker:
    <<: *app
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *app-env
      WORKER_METRICS_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:4002:4002'
    depends_on: *app-deps

  web:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4001}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
        NEXT_PUBLIC_FORCE_TURN_RELAY: ${NEXT_PUBLIC_FORCE_TURN_RELAY:-false}
        DEPLOY_ENV: ${DEPLOY_ENV:-development}
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'

  admin:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    environment:
      NODE_ENV: production
      ADMIN_EVIDENCE_ORIGIN: http://localhost:9000
    ports:
      - '127.0.0.1:3001:3001'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
