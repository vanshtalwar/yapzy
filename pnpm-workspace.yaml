packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

engineStrict: true

# Single source of truth for shared tool/library versions ("catalog:" in package.json).
catalog:
  '@aws-sdk/client-s3': ^3.1100.0
  '@aws-sdk/s3-request-presigner': ^3.1100.0
  buffer: ^6.0.3
  bullmq: ^6.5.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.0
  eslint-plugin-simple-import-sort: ^14.0.0
  '@eslint/js': ^10.0.1
  fastify: ^5.12.7
  fastify-plugin: ^6.0.1
  fastify-type-provider-zod: ^7.0.0
  '@fastify/cookie': ^11.1.0
  '@fastify/cors': ^11.3.1
  '@fastify/helmet': ^13.2.0
  '@fastify/multipart': ^10.1.0
  '@fastify/rate-limit': ^11.2.1
  '@fastify/sensible': ^6.0.7
  globals: ^17.13.0
  ioredis: ^6.0.0
  jose: ^6.2.0
  jsdom: ^30.1.0
  lucide-react: ^1.66.0
  next: ^16.4.0
  # Pinned: 4.4.0 declares engines.node "22.13.0" (exact), which engineStrict rejects on Node 24.
  nsfwjs: 4.3.0
  '@next/eslint-plugin-next': ^16.4.0
  '@node-rs/argon2': ^2.2.2
  obscenity: ^0.4.6
  otplib: ^13.0.0
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  postcss: ^8.5.0
  prettier: ^3.9.10
  # Pinned: the CLI's npm `latest` tag pointed at 8.0.0-rc.29 (2026-10-31); keep CLI and client in lockstep.
  prisma: 7.10.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  proxy-addr: ^2.0.7
  qrcode: ^1.5.4
  radix-ui: ^1.8.0
  react: ^19.3.0
  react-dom: ^19.3.0
  # node-redis: only for the Socket.io sharded adapter (CONTEXT.md D-031); ioredis everywhere else.
  redis: ^6.3.0
  sharp: ^0.35.0
  socket.io: ^4.8.4
  socket.io-client: ^4.8.4
  '@socket.io/redis-adapter': ^8.3.0
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.0
  '@tensorflow/tfjs': ^4.22.0
  '@tailwindcss/postcss': ^4.3.0
  '@testing-library/dom': ^10.4.0
  '@testing-library/react': ^16.3.0
  tsup: ^9.0.0
  tsx: ^4.23.15
  turbo: ^2.11.10
  '@types/node': ^24.0.0
  '@types/proxy-addr': ^2.0.3
  '@types/qrcode': ^1.5.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # typescript-eslint supports TypeScript < 6.1; TS 7 (native) has no compiler API yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  ulid: ^3.0.2
  vitest: ^5.0.5
  zod: ^4.6.7
  zustand: ^5.0.16

allowBuilds:
  '@prisma/engines': true
  # Pulled in by @tensorflow/tfjs; its postinstall only prints a funding message.
  core-js: false
  esbuild: true
  msgpackr-extract: false
  prisma: true

minimumReleaseAgeExclude:
  - lucide-react@1.66.0
