# Playwright end-to-end suite against the real stack (manual: it needs Docker infra, the
# internet for Cloudflare Turnstile and ~5 minutes). See e2e/playwright.config.ts.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Environment and infrastructure (Postgres, Redis, coturn, MinIO)
        run: |
          cp .env.example .env
          pnpm infra:up
          pnpm db:deploy
      - name: Browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - name: Build and run the suite
        run: pnpm test:e2e
      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
